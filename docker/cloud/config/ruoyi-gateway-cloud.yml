# 网关演示配置（dataId=ruoyi-gateway-cloud.yml）
# 只保留已部署模块的路由：auth、system、dqservice；不启用 gen/job/file
spring:
  redis:
    host: platform-redis
    port: 6379
    password: ${DQ_REDIS_PASSWORD}
  cloud:
    gateway:
      discovery:
        locator:
          lowerCaseServiceId: true
          enabled: true
      routes:
        # 认证中心
        - id: ruoyi-auth
          uri: lb://ruoyi-auth
          predicates:
            - Path=/auth/**
          filters:
            # 验证码处理
            - CacheRequestFilter
            - ValidateCodeFilter
            - StripPrefix=1
        # 系统模块
        - id: ruoyi-system
          uri: lb://ruoyi-system
          predicates:
            - Path=/system/**
          filters:
            - StripPrefix=1
        # 数据质量服务：两个副本共用同一服务名，由此处 lb 轮询
        - id: ruoyi-dqservice
          uri: lb://ruoyi-dqservice
          predicates:
            - Path=/dqservice/**
          filters:
            - StripPrefix=1
    loadbalancer:
      # 关闭 LoadBalancer 额外实例列表缓存，缩短故障实例摘除时间；发现仍由 Nacos 推送
      cache:
        enabled: false
      # 明确不开启失败重试：检测执行会写报告，重试会导致重复执行
      retry:
        enabled: false

# 安全配置
security:
  # 验证码保持开启，演示不与真实登录行为脱节
  captcha:
    enabled: true
    type: math
  # 防止XSS攻击
  xss:
    enabled: true
    excludeUrls:
      - /system/notice
  # 不校验白名单
  ignore:
    whites:
      - /auth/logout
      - /auth/login
      - /auth/register
      - /*/v2/api-docs
      - /csrf
